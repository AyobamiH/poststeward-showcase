name: Deploy showcase

on:
  push:
    branches: [main]
    paths:
      - public/**
      - scripts/**
      - wrangler.jsonc
      - wrangler.domain.jsonc
      - package.json
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - custom-domain
          - workers-dev
        default: custom-domain

permissions:
  contents: read

concurrency:
  group: poststeward-showcase-deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'AyobamiH/poststeward-showcase' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run verify
      - run: node --check public/app.js
      - run: node --check scripts/smoke-deployment.mjs

  deploy:
    needs: verify
    if: github.repository == 'AyobamiH/poststeward-showcase' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: showcase
    env:
      # Cloudflare account IDs are identifiers, not credentials. This value was
      # recovered from canonical PostSteward's redacted staging inspection.
      CLOUDFLARE_ACCOUNT_ID: 6ddcbcb8474f1a7e460b2f0aabec0e2f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check deployment credential
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: configure only the dedicated CLOUDFLARE_API_TOKEN secret in the showcase environment."
          fi

      - name: Select deployment target
        if: steps.credentials.outputs.ready == 'true'
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          # The purchased production domain is the normal main-branch target.
          # workers.dev remains available only as an explicit diagnostic target.
          mode="custom-domain"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${REQUESTED_TARGET:-custom-domain}"
          fi

          if [[ "$mode" == "workers-dev" ]]; then
            echo "config=wrangler.jsonc" >> "$GITHUB_OUTPUT"
            echo "origins=https://poststeward-showcase.woeinvests.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "config=wrangler.domain.jsonc" >> "$GITHUB_OUTPUT"
            echo "origins=https://poststeward.com,https://www.poststeward.com" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Deploy exact Wrangler version
        if: steps.credentials.outputs.ready == 'true'
        env:
          WRANGLER_CONFIG: ${{ steps.target.outputs.config }}
        run: npx --yes wrangler@4.130.0 deploy --config "$WRANGLER_CONFIG"

      - name: Verify hosted deployment
        if: steps.credentials.outputs.ready == 'true'
        env:
          SHOWCASE_ORIGINS: ${{ steps.target.outputs.origins }}
        run: node scripts/smoke-deployment.mjs
