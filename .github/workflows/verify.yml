name: Verify showcase

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # Owner-authored same-repository changes use the isolated one-job runner.
    # Forks and other actors never receive work on the owner's machine.
    runs-on: ${{ github.repository == 'AyobamiH/poststeward-showcase' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.actor == 'AyobamiH' && github.event.pull_request.head.repo.full_name == github.repository) && 'poststeward-showcase' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify public boundary and launch contract
        run: npm run verify
      - name: Verify public operation catalogue against live application
        run: npm run verify:live-catalogue
      - name: Verify distribution provenance and failure cases
        run: node --test tests/*.test.mjs
      - name: Verify self-hosted runner recovery safeguards
        run: python3 -B ops/actions-runner/test_runner_lifecycle.py
      - name: Verify existing schedule watchdog and on-failure alert safeguards
        run: python3 -B -m unittest discover -s ops/actions-runner -p 'test_*.py'
      - name: Check distribution reconciler syntax
        run: node --check scripts/distribution-reconcile.mjs
      - name: Check GitHub release controller syntax
        run: node --check scripts/github-release-control.mjs
      - name: Verify bounded JIT runner cleanup safety (no GitHub effects)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
      - name: Check hosted smoke verifier syntax
        run: node --check scripts/smoke-deployment.mjs
