name: Verify showcase

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: showcase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify architecture boundary and evidence
        run: npm run verify
      - name: Check browser JavaScript syntax
        run: node --check public/app.js
