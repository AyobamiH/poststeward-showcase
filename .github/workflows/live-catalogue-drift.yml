name: Live agent operation catalogue drift
on:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    # The only executable sources are the canonical default branch on a
    # natural schedule or an explicit owner dispatch against that same ref.
    # Never admit fork/unreviewed branch code to the owner's isolated runner.
    if: >-
      ${{ github.repository == 'AyobamiH/poststeward-showcase' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' && github.actor == 'AyobamiH')) }}
    runs-on: poststeward-showcase
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm run verify
      - run: npm run verify:live-catalogue
