name: Reconcile public beta distribution
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: poststeward-distribution-reconcile
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'AyobamiH/poststeward-showcase' && github.ref == 'refs/heads/main'
    runs-on: poststeward-showcase
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Detect drift and verify candidate runtime independently
        id: inspect
        run: node scripts/distribution-reconcile.mjs verify
      - name: Require exact staged source CI acceptance
        if: steps.inspect.outputs.drift == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BETA: ${{ steps.inspect.outputs.beta }}
        run: node scripts/github-release-control.mjs check
      - name: Dispatch existing protected release workflow
        if: steps.inspect.outputs.drift == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STABLE: ${{ steps.inspect.outputs.stable }}
          BETA: ${{ steps.inspect.outputs.beta }}
        run: node scripts/github-release-control.mjs dispatch
      - name: Await verified public convergence
        if: steps.inspect.outputs.drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if node scripts/distribution-reconcile.mjs confirm; then exit 0; fi
            sleep 12
          done
          echo '::error::Public beta did not converge after protected release dispatch'
          exit 1
      - name: Confirm exact public channel bytes
        run: node scripts/distribution-reconcile.mjs confirm
      - name: Resolve prior drift incident only after convergence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-release-control.mjs resolve
      - name: Open or update persistent failure incident
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github-release-control.mjs alert
